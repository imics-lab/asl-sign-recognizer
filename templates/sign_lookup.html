<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Sign Recognition</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; margin: 0; background-color: #f4f4f4; color: #333; }
        .container { max-width: 900px; margin: 20px auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 5px; background-color: #f9f9f9;}
        
        /* Webcam and Upload Areas */
        .display-area { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #videoDisplay { max-width: 100%; width: 480px; border: 2px solid #ccc; border-radius: 4px; background-color: #000; }
        @keyframes blink { 50% { opacity: 0; } }
        #videoContainer {position: relative}

        /* Input Area */
        #input-area {display: flex; flex-direction: column; align-items: center;}

        /* Textbox */
        #search-box { width: 100%; margin: 5%;}

        /* Buttons */
        #play-button { width: 50px; height: 50px; background: #555; clip-path: polygon(0 0, 100% 50%, 0 100%); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);}       
        #restart-button { position: relative; height: 40px; width: 40px; border: 4px solid #555; border-radius: 50%; border-top-color: transparent;position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: none; }
        #restart-button::after { content: ""; position: absolute; top: -8px; right: 4px; width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 8px solid #555; transform: rotate(230deg);}
        #submit-button { width: 50%;}

        /* Status and Tips */
        .tips-section { background-color: #e7f3fe; border-left: 5px solid #2196F3; padding: 15px; margin-top: 20px; }
        .tips-section h3 { margin-top: 0; color: #2196F3; }
        .tips-section ul { padding-left: 20px; }

        nav { display: flex; text-align: center; background-color: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 5px; margin-bottom: 15px;}
        nav a {flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #337ab7; font-weight: bold; padding: 0 15px;}
        nav a:not(:first-child) { border-left: 1px solid #ccc;}

        /* Inline label + input for clarity */
        .lookup-input-row { display: flex; align-items: center; gap: 10px; width: 100%; }
        .lookup-input-row label { white-space: nowrap; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign Dictionary</h1>
        <nav>
            <a href="/">Sign Recognition</a>
            <a href="/sign_lookup">Sign Dictionary</a>
            <a href="/landmark_extractor">Landmark Extractor</a>
            <a href="/playback">Playback Tool</a>
        </nav>

        <!-- Section 1: Sign Video Display -->
        <div class="section">
            <h1>Display Sign Via Text Search</h1>
            <h2 id="searched-word-title"></h1>
            <div class="display-area">
                <div id="videoContainer">
                    <video id="videoDisplay" hidden="true" playsinline muted></video> <!-- Muted to prevent feedback -->
                    <button id="play-button" hidden="true"></button>
                    <button id="restart-button" hidden="true"></button>
                </div>
                
                <canvas id="canvas" style="display: none;"></canvas> <!-- Hidden canvas for frame grabbing -->
                <div id="input-area">
                    <p id="error-message" hidden="true" style="color: red;"></p>
                    <div class="lookup-input-row">
                        <label for="search-box">Enter word:</label>
                        <input id="search-box" type="text" placeholder="e.g., hello">
                    </div>
                    <button id="submit-button">Search</button>
                </div>
            </div>
        </div>

        <!-- Section 2: Tips for Better Recognition -->
        <div class="section tips-section">
            <h3>Tip For Sign Search</h3>
            <ul>
                <li>Ensure words are spelled correctly.</li>
                <li> View the list of available words <a href="https://github.com/dxli94/WLASL/blob/master/code/I3D/preprocess/wlasl_class_list.txt">here</a>.</li>
            </ul>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="/static/js/lookup.js"></script>
</body>
</html>
