# docker-compose.yml

services:
  # Your Flask/SocketIO Application
  app:
    build: . # Build from the Dockerfile in the current directory
    container_name: sign_language_app_service
    restart: unless-stopped
    # Local development: expose the app directly on localhost:5000
    ports:
      - "5000:5000"
    volumes:
      # Use named volumes for persistent data (recommended)
      - uploads_data:/app/uploads
      - landmarks_data:/app/data
      # Optional: live-edit Sign Dictionary videos without rebuilding the image
      # - /absolute/path/to/your/static/videos:/app/static/videos:ro
      # Or use host paths on the VM (adjust path as needed):
      # - ./vm_uploads:/app/uploads
      # - ./vm_data:/app/data
    command: ["python", "app.py"] # Or use gunicorn for production (see notes)

  # Cloud/production: enable Nginx reverse proxy with HTTPS
  # To re-enable on Azure:
  # 1) Create directory `nginx/` and add a file `default.conf` with your server blocks
  # 2) Update mounts to use directory-to-directory mapping:
  #      - ./nginx:/etc/nginx/conf.d:ro
  # 3) If using Let's Encrypt, mount certs inside the VM:
  #      - /etc/letsencrypt:/etc/letsencrypt:ro
  # 4) Expose ports 80 and 443 on the proxy, and remove the app's ports mapping
  # 5) Uncomment the block below
  # nginx:
  #   image: nginx:stable-alpine
  #   container_name: sign_language_nginx_proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx:/etc/nginx/conf.d:ro
  #     - uploads_data:/app/uploads:ro
  #     - landmarks_data:/app/data:ro
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  #   depends_on:
  #     - app

volumes:
  # Define named volumes
  uploads_data:
  landmarks_data:

